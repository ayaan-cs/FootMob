# Generate the Xcode project with:  xcodegen generate
# (install once with:  brew install xcodegen)
name: FootMob

options:
  bundleIdPrefix: com.footmob
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # ⬇︎ Change these two so they're unique to you (e.g. com.yourname.footmob).
    #   Leave DEVELOPMENT_TEAM empty and pick your free "Personal Team" in Xcode → Signing.
    BUNDLE_ID_PREFIX: com.footmob
    APP_GROUP_ID: group.com.footmob.shared
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"

packages:
  FootMobKit:
    path: Packages/FootMobKit

targets:
  FootMob:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: FootMobKit
      - target: FootMobWidgets
        embed: true
    entitlements:
      path: App/FootMob.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FootMob
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FootMobAppGroup: $(APP_GROUP_ID)
        LSApplicationCategoryType: public.app-category.sports
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.footmob.refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - footmob
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FootMobWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: FootMobKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/FootMobWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: FootMob Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FootMobAppGroup: $(APP_GROUP_ID)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.widgets
        SKIP_INSTALL: YES

schemes:
  FootMob:
    build:
      targets:
        FootMob: all
        FootMobWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FootMobKit/FootMobKitTests
